[project]
name = "semi-systematic"
version = "0.1.0"
description = "Data, research and dashboards for the semi-systematic fund (the systematic side, as a monorepo)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.3",
    "polars>=1.30",
    "pyarrow>=20",
    "boto3>=1.38",
    "python-dotenv>=1.1",
    "pyyaml>=6.0",
    "marimo>=0.14",
    "typer>=0.16",
    "brain",
    "backtest",
]

[project.optional-dependencies]
# Optional groups. src/quant must import only the base group (enforced by ruff TID251).
ml = ["scikit-learn>=1.6", "statsmodels>=0.14"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.12",
    "pre-commit>=4.2",
    "python-frontmatter>=1.1",
]

[tool.uv.workspace]
members = ["tools/*"]

[tool.uv.sources]
brain = { workspace = true }
backtest = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quant"]

[tool.pytest.ini_options]
testpaths = ["tests", "tools/brain/tests", "tools/backtest/tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".index", "research/experiments/*/figures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "TID"]
ignore = ["E501"]

# src/quant may import only the base dependency group. The ml group is banned
# repo-wide and re-allowed below for research, tools and dashboards.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"sklearn".msg = "optional group 'ml': not allowed in src/quant. Use it from research/ or tools/."
"statsmodels".msg = "optional group 'ml': not allowed in src/quant. Use it from research/ or tools/."
"torch".msg = "optional group 'ml': not allowed in src/quant. Use it from research/ or tools/."
"lightgbm".msg = "optional group 'ml': not allowed in src/quant. Use it from research/ or tools/."
"xgboost".msg = "optional group 'ml': not allowed in src/quant. Use it from research/ or tools/."

[tool.ruff.lint.per-file-ignores]
"research/**" = ["TID251"]
"tools/**" = ["TID251"]
"dashboards/**" = ["TID251"]
