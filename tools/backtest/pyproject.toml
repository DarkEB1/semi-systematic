[project]
name = "backtest"
version = "0.1.0"
description = "Backtesting loop shared by experiments (reserved; filled on second use)"
requires-python = ">=3.12,<3.13"
dependencies = ["polars>=1.30", "pyarrow>=20"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backtest"]
