[project]
name = "backtest"
version = "0.2.0"
description = "Daily backtesting engine for any position-based strategy"
requires-python = ">=3.12,<3.13"
dependencies = ["polars>=1.30", "pyarrow>=20"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backtest"]
