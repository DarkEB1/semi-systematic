[project]
name = "backtest"
version = "0.2.0"
description = "Walk-forward splits, net PnL scores and a joint Rademacher haircut for a family of candidates"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backtest"]
