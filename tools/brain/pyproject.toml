[project]
name = "brain"
version = "0.2.0"
description = "Retrieval index over a plain-text repository: chunker, parquet builder, search, INDEX.md generator"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.3",
    "pyarrow>=20",
    "pyyaml>=6.0",
    "typer>=0.16",
]

[project.scripts]
brain = "brain.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brain"]
