name: index

# On merge to main: rebuild the retrieval index and upload chunks.parquet to
# curated/repo_index/snapshot=<sha>/ with the ingest secret (promote role: curated/ is append-only).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: index
  cancel-in-progress: true

jobs:
  index:
    runs-on: ubuntu-latest
    env:
      QUANT_ROLE: promote
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.eu.r2.cloudflarestorage.com
      R2_BUCKET: semi-sys-research-data
      R2_ACCESS_KEY_ID: ${{ secrets.R2_INGEST_KEY }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_INGEST_SECRET }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6.4.3
        with:
          version: "0.13.6"
          enable-cache: true
      - uses: extractions/setup-just@e33e0265a09d6d736e2ee1e0eb685ef1de4669ff # v3.0.0
        with:
          just-version: "1.59.0"
      - name: Sync locked environment
        run: uv sync --frozen --all-groups
      - name: just index
        run: just index
      - name: just index-upload
        run: just index-upload
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: chunks-${{ github.sha }}
          path: .index/chunks.parquet
          retention-days: 7
