name: audit

# Nightly bucket audit: every key under raw/, curated/ or scratch/<known handle>/, total < 8 GB.
# Opens an issue on findings.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.eu.r2.cloudflarestorage.com
      R2_BUCKET: semi-sys-research-data
      R2_ACCESS_KEY_ID: ${{ secrets.R2_INGEST_KEY }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_INGEST_SECRET }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6.4.3
        with:
          version: "0.13.6"
          enable-cache: true
      - uses: extractions/setup-just@e33e0265a09d6d736e2ee1e0eb685ef1de4669ff # v3.0.0
        with:
          just-version: "1.59.0"
      - name: Sync locked environment
        run: uv sync --frozen --all-groups
      - name: just audit
        run: just audit --max-gb 8 --issue
