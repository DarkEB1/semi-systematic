name: ingest

# Nightly raw/ ingest for every source registered in src/quant/ingest/__init__.py.
# The matrix below is kept in sync with the registry by the pull-data skill and checked by the
# first job. Runs 01:30 UTC Tuesday to Saturday (after each business day).

on:
  schedule:
    - cron: "30 1 * * 2-6"
  workflow_dispatch:
    inputs:
      since:
        description: "Re-ingest from this date (YYYY-MM-DD); empty = default lookback"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6.4.3
        with:
          version: "0.13.6"
          enable-cache: true
      - name: Sync locked environment
        run: uv sync --frozen --all-groups
      - name: Registry and matrix agree
        run: |
          set -euo pipefail
          registered="$(uv run python -m quant.ingest --list | sort | tr '\n' ' ')"
          matrix="$(grep -oP 'source: \[\K[^\]]+' .github/workflows/ingest.yml | tr -d ' ' | tr ',' '\n' | sort | tr '\n' ' ')"
          echo "registered: $registered"; echo "matrix:     $matrix"
          test "$registered" = "$matrix" || { echo "::error::ingest.yml matrix differs from the registry; run the pull-data skill"; exit 1; }

  ingest:
    needs: registry
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        source: [yahoo]
    env:
      QUANT_ROLE: ingest
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.eu.r2.cloudflarestorage.com
      R2_BUCKET: semi-sys-research-data
      R2_ACCESS_KEY_ID: ${{ secrets.R2_INGEST_KEY }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_INGEST_SECRET }}
      VENDOR_API_KEY: ${{ secrets.VENDOR_API_KEY }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6.4.3
        with:
          version: "0.13.6"
          enable-cache: true
      - uses: extractions/setup-just@e33e0265a09d6d736e2ee1e0eb685ef1de4669ff # v3.0.0
        with:
          just-version: "1.59.0"
      - name: Sync locked environment
        run: uv sync --frozen --all-groups
      - name: just ingest ${{ matrix.source }}
        run: |
          if [ -n "${{ inputs.since }}" ]; then
            just ingest "${{ matrix.source }}" --since "${{ inputs.since }}"
          else
            just ingest "${{ matrix.source }}"
          fi
